name: leaderboard moderation audit

# Answers the question the anti-cheat detector never asks: not "is this account
# cheating?" but "does the data we withheld still match the accounts we banned?"
#
# On 2026-07-21 a batch quarantine keyed on a conversation-spike heuristic moved
# rows for 40 users while only 8 of them reached the block list. The other 32
# had 51.1B tokens withheld for five weeks, and it surfaced only because one of
# them opened issue #534 asking why their device flow returned 403. Nothing in
# the hourly scanner could have caught that: it looks for new cheating, not for
# collateral damage from our own moderation.
#
# A ban is a judgement call, so this deliberately does NOT try to re-litigate
# one. It reports a plain contradiction instead -- data quarantined for an
# account nobody banned -- which needs no threshold and has no false positives.
# Counts only; identities stay out of the public log and are pulled from the
# table by hand.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: leaderboard-moderation-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      API: https://srctyff5.us-east.insforge.app/functions/tokentracker-leaderboard-refresh
    steps:
      - name: Audit quarantine against the block list
        run: |
          set -euo pipefail

          response_file=$(mktemp)
          if ! http_code=$(curl --fail-with-body -sS --max-time 60 \
            --retry 2 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            -o "$response_file" -w '%{http_code}' "$API?quarantine_audit=1"); then
            echo "::error::quarantine audit request failed (HTTP ${http_code:-transport error})"
            jq -c '{error}' "$response_file" 2>/dev/null || cat "$response_file"
            exit 1
          fi
          audit=$(cat "$response_file")
          rm -f "$response_file"

          # Fail closed on a malformed payload: a silently empty read would
          # otherwise look identical to "no orphans", which is exactly the
          # false green this job exists to prevent.
          if ! jq -e '
            .ok == true and
            (.blocklist_configured | type == "boolean") and
            (.orphan_users | type == "number") and
            (.orphan_rows | type == "number") and
            (.orphan_tokens | type == "number") and
            (.blocked_total | type == "number") and
            (.blocked_without_flags | type == "number")
          ' >/dev/null <<<"$audit"; then
            echo "::error::quarantine audit returned an invalid payload"
            exit 1
          fi

          blocklist_configured=$(jq -r '.blocklist_configured' <<<"$audit")
          orphan_users=$(jq -r '.orphan_users' <<<"$audit")
          orphan_rows=$(jq -r '.orphan_rows' <<<"$audit")
          orphan_tokens=$(jq -r '.orphan_tokens' <<<"$audit")
          oldest=$(jq -r '.oldest_orphan_quarantined_at // "n/a"' <<<"$audit")
          blocked_total=$(jq -r '.blocked_total' <<<"$audit")
          blocked_without_flags=$(jq -r '.blocked_without_flags' <<<"$audit")

          {
            echo "### Leaderboard moderation audit"
            echo
            echo "| check | value |"
            echo "|---|---:|"
            echo "| quarantined users with no ban | $orphan_users |"
            echo "| withheld rows | $orphan_rows |"
            echo "| withheld tokens | $orphan_tokens |"
            echo "| oldest withheld since | \`$oldest\` |"
            echo "| accounts on the block list | $blocked_total |"
            echo "| of those, never flagged by the detector | $blocked_without_flags |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$blocklist_configured" != "true" ]]; then
            echo "::error::LEADERBOARD_BLOCKED_USER_IDS is not configured; the audit cannot distinguish a banned account from an orphan"
            exit 1
          fi

          # Hand-entered bans were never checked against the automated criteria,
          # so they are the ones worth re-reviewing first. A signal, not a
          # verdict: a slow-drip cheater can sit below every peak threshold and
          # still be correctly banned. Never fail the job on this.
          if (( blocked_without_flags > 0 )); then
            echo "::warning::$blocked_without_flags blocked account(s) have no detector flag; re-review them against the current criteria"
          fi

          if (( orphan_users > 0 )); then
            echo "::error::$orphan_users account(s) have quarantined usage but are not on the block list ($orphan_rows rows, $orphan_tokens tokens, oldest $oldest). Restore them or ban them -- withholding data from an account nobody banned is a bug."
            exit 1
          fi

          echo "No orphaned quarantine: every withheld row belongs to a blocked account."
